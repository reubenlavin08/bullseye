[project]
name = "deal_finder"
version = "0.1.0"
description = "Facebook Marketplace deal pipeline: scrape, dedupe, score against eBay sold comps, alert."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "psycopg2-binary>=2.9.9",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
